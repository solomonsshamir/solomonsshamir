<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mirror Linkler</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #0d1117;
            color: #58a6ff;
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 40px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
            max-width: 700px;
        }

        .links a {
            color: #58a6ff;
            text-decoration: none;
            font-size: 1rem;
            padding: 12px 16px;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            transition: border-color 0.2s, background 0.2s;
        }

        .links a:hover {
            border-color: #58a6ff;
            background: #21262d;
        }
    </style>
</head>
<body>

    <h1>🔗 Mirror Linkler</h1>

    <div class="links">
        <a href="https://satlab.ziaurrahoman138.workers.dev/" target="_blank">Site 1</a>
        <a href="https://sprightly-vacherin-63b978.netlify.app/" target="_blank">Site 2</a>
        <a href="//satlabonline.surge.sh" target="_blank">Site 3</a>
    </div>

</body>
</html>
